{% extends "base.html" %}

{%block content %}
<main class="main--home">
    <section class="projects">
        {%for project in projects %}
        <a class="single-project__link" href="{{url_for('project_detail', slug=project['slug'])}}">
            <article class="project--card">
                <img class="project--card__image" src="{{url_for('static', filename=project['thumb'])}}" alt="{{project['name']}} image"/> 
                <header class="project--card__meta">
                    <ul class="meta__categories">
                        {% for category in project.get_categories()%}
                        <li class="single__category">{{category}}</li>
                        {%endfor%}
                    </ul>
                    <h2 class="meta__name">{{project['name']}}</h2>
                </header>
            </article>
        </a>
        {%endfor%}
    </section>
</main>
{%endblock%}
