{% extends "base.html" %}
{% block title %}Verify code · Portfolio{% endblock %}

{% block content %}
<section style="max-width: 480px; margin: 0 auto;">
  <h1>Verify reset code</h1>
  <p class="muted">Enter the 6-digit code sent to you.</p>

  <div class="card">
    <form method="post" action="{{ url_for('verify_reset_code') }}">
      <label for="code">Reset code</label>
      <input type="text" id="code" name="code" required
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder="123456" autocomplete="one-time-code">

      <button type="submit">Verify code</button>
    </form>

    <p style="margin-top: 1rem;">
      <a href="{{ url_for('forgot_password') }}">Request a new code</a>
    </p>
  </div>
</section>
{% endblock %}
