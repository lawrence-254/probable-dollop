{% extends "base.html" %}
{% block title %}Edit {{ project.name }} · Portfolio{% endblock %}

{% block content %}
<section style="max-width: 720px;">
  <p><a href="{{ url_for('add_information') }}">← Back to dashboard</a></p>
  <h1>Edit project</h1>

  <div class="card">
    <form method="post"
          action="{{ url_for('edit_project', project_id=project.id) }}"
          enctype="multipart/form-data">

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required value="{{ project.name }}">

      <label for="tech">Categories / stack (comma-separated)</label>
      <input type="text" id="tech" name="tech" value="{{ categories_csv }}">

      <label for="description">Description</label>
      <textarea id="description" name="description">{{ project.description or '' }}</textarea>

      <label for="aim">Aims (comma-separated)</label>
      <input type="text" id="aim" name="aim" value="{{ aims_csv }}">

      <label for="live_link">Live site URL</label>
      <input type="url" id="live_link" name="live_link" value="{{ project.live_site or '' }}">

      <label for="video_link">Preview video URL</label>
      <input type="url" id="video_link" name="video_link" value="{{ project.preview_video_link or '' }}">

      <label for="thumbnail">Replace thumbnail (optional)</label>
      <input type="file" id="thumbnail" name="thumbnail" accept=".png,.jpg,.jpeg,.gif,.webp,image/*">
      {% if project.thumb %}
        <p class="hint">Current:
          <a href="{{ url_for('static', filename=project.thumb) }}" target="_blank">view</a>
        </p>
      {% endif %}

      <label for="hero">Replace hero image (optional)</label>
      <input type="file" id="hero" name="hero" accept=".png,.jpg,.jpeg,.gif,.webp,image/*">
      {% if project.hero %}
        <p class="hint">Current:
          <a href="{{ url_for('static', filename=project.hero) }}" target="_blank">view</a>
        </p>
      {% endif %}

      <button type="submit">Save changes</button>
    </form>
  </div>
</section>
{% endblock %}
