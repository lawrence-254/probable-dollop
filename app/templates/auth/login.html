
{%extends "auth/layout.html"%}
{%block protected%}
<label class="authentication__title">authenticate</label>
<form class="authentication__form--container" method="post">
    <label  class="authentication__label">Email</label>
    <input class="authentication__input" type="email" name="email" />
    <label class="authentication__label">Password</label>
    <input class="authentication__input" type="password" name="password" />
    <input type="submit" value="login" class="login__button"/>
</form>

<div class="auth-container">

    <h1>Admin Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div>
            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        <a href="{{ url_for('forgot_password') }}">
            Forgot your password?
        </a>
    </p>

</div>

<a href="{{ url_for('home')}}" class="home__link" >Go to homescreen</a>
{%endblock%}
