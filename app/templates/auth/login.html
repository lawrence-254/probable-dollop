{% extends "base.html" %}
{% block title %}Admin login · Portfolio{% endblock %}

{% block content %}
<section style="max-width: 480px; margin: 0 auto;">
  <h1>Admin login</h1>
  <p class="muted">
    If no admin exists yet, the first successful submission creates the account.
  </p>

  <div class="card">
    <form method="post" action="{{ url_for('login_or_register') }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">

      <button type="submit">Continue</button>
    </form>

    <p style="margin-top: 1rem;">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </p>
  </div>
</section>
{% endblock %}
